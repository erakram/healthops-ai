# Render Blueprint: in the Render dashboard, New > Blueprint > pick this repo, then paste your
# GROQ_API_KEY when asked. The demo signs in with one click, so anyone with the link uses your key.
#
# Free plan: services sleep after ~15 idle minutes (the first visit then takes about a minute),
# the free Postgres database is removed after 30 days, and uploaded files are lost on restart.
# The demo data is re-seeded automatically on an empty database.
services:
  - type: web
    name: healthops-api
    runtime: docker
    plan: free
    # Paths are relative to the repo root (Render resolves them from there).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # Render asks for the value; it's never stored in the repo
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: healthops-db, property: connectionString }
      - key: PHI_MASKING
        value: "true"

  - type: web
    name: healthops-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    buildFilter:
      paths: ["frontend/**"]
    envVars:
      # The frontend forwards /api/* to the API. Render passes this to the Docker build, where the
      # address is baked in, so if Render gives the API a different URL, change it here and redeploy.
      - key: BACKEND_URL
        value: https://healthops-api.onrender.com

databases:
  - name: healthops-db
    plan: free
