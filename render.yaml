# Render Blueprint: New > Blueprint > pick this repo.
# Free-plan disks are temporary: uploads and the database reset on restart, and the
# demo history is re-seeded automatically.
services:
  - type: web
    name: healthops-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false  # Render asks for the value; it's never stored in the repo
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: healthops-db, property: connectionString }

  - type: web
    name: healthops-web
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://healthops-api.onrender.com  # change to your API service's URL

databases:
  - name: healthops-db
    plan: free
